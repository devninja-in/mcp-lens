[project]
name = "mcp-lens"
version = "0.1.0"
description = "Inspect, evaluate, and manage your MCP server tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "MCP Lens Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.32",
    "cryptography>=43.0",
]

[project.urls]
Homepage = "https://github.com/mcp-lens/mcp-lens"
Documentation = "https://github.com/mcp-lens/mcp-lens#readme"
Repository = "https://github.com/mcp-lens/mcp-lens"
Issues = "https://github.com/mcp-lens/mcp-lens/issues"
Changelog = "https://github.com/mcp-lens/mcp-lens/blob/main/CHANGELOG.md"

[project.scripts]
mcp-lens = "src.app.eval.cli:main"

[project.optional-dependencies]
eval-anthropic = ["anthropic>=0.25.0"]
eval-anthropic-vertex = ["anthropic[vertex]>=0.25.0"]
eval-openai = ["openai>=1.0.0"]
eval-vertexai = ["google-genai>=1.0.0"]
postgres = [
    "asyncpg>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
